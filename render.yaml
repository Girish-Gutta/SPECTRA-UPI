services:
  - type: web
    name: spectra-upi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spectra-upi-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: spectra-upi-db
    plan: free
